<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<script>
			if (typeof window !== 'undefined') {
				if (!window.crypto) window.crypto = {};
				if (!window.crypto.randomUUID) {
					window.crypto.randomUUID = function() {
						return '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, function(c) {
							return (c ^ (crypto.getRandomValues ? crypto.getRandomValues(new Uint8Array(1))[0] : Math.random() * 16) & 15 >> c / 4).toString(16);
						});
					};
				}
				try {
					var __testKey = '__storage_test__';
					window.localStorage.setItem(__testKey, __testKey);
					window.localStorage.removeItem(__testKey);
				} catch (e) {
					var __mem = {};
					try {
						Object.defineProperty(window, 'localStorage', {
							value: {
								getItem: function(k) { return Object.prototype.hasOwnProperty.call(__mem, k) ? __mem[k] : null; },
								setItem: function(k, v) { __mem[k] = String(v); },
								removeItem: function(k) { delete __mem[k]; },
								clear: function() { __mem = {}; },
								key: function(i) { return Object.keys(__mem)[i] || null; },
								get length() { return Object.keys(__mem).length; }
							},
							configurable: true,
							writable: true
						});
					} catch (_) {}
				}
			}
		</script>

		<link rel="icon" href="favicon.ico" sizes="48x48" />
		<link rel="icon" href="favicon.svg" sizes="any" type="image/svg+xml" />

		<link rel="apple-touch-icon" href="apple-touch-icon-180x180.png" />

		<link rel="manifest" href="./manifest.webmanifest" />

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
		/>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
